name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install runtime dependencies
        # README quickstart: websockets + aiohttp are required, zeroconf optional.
        # Without these, the import-smoke step fails on `import aiohttp` (broker.py:23).
        run: pip install websockets aiohttp

      - name: Install test dependencies
        # pytest.ini declares pytest-asyncio config options and the suite
        # imports pytest_asyncio directly; without it collection fails with
        # ModuleNotFoundError. Kept in requirements-dev.txt so the gate and
        # local `make test` install the same set.
        run: pip install -r requirements-dev.txt

      - name: Python syntax check
        run: |
          python -m py_compile broker.py
          python -m py_compile cli.py
          python -m py_compile connect.py
          find scripts tests clients -name '*.py' -print0 \
            | xargs -0 -n1 python -m py_compile

      - name: Bash script syntax check
        run: |
          for f in scripts/* ; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q '^#!.*\(bash\|sh\)' || continue
            bash -n "$f"
          done

      - name: state.json schema sanity (if checked in)
        run: |
          if [ -f state.json ]; then
            python -c "
          import json, sys
          s = json.load(open('state.json'))
          required = ['schema_version', 'messages', 'tasks', 'memory',
                      'flows', 'approvals', 'votes', 'audit', 'channels']
          missing = [k for k in required if k not in s]
          if missing: print('missing keys:', missing); sys.exit(1)
          print('state.json schema OK, version=' + str(s['schema_version']))
          "
          else
            echo "no state.json checked in (expected) — skipping"
          fi

      - name: Broker import-smoke (no network)
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          import broker
          assert hasattr(broker, 'Broker'), 'Broker class missing'
          print('broker.py import OK; constants:',
                'UI_PORT=' + str(broker.UI_PORT),
                'INSTANCE_PORT=' + str(broker.INSTANCE_PORT),
                'MAX_MESSAGES_IN_STATE=' + str(broker.MAX_MESSAGES_IN_STATE))
          "

      - name: pre-commit (if installed)
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            pip install pre-commit
            pre-commit run --all-files --show-diff-on-failure || true
          fi
